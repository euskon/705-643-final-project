# PointNeXt-S, initialised from the official S3DIS (area 5) checkpoint.
# Architecture identical to third_party/PointNeXt/cfgs/s3dis/pointnext-s.yaml
# (so every encoder/decoder tensor loads); only the head's class count differs.
# ~0.8 M params, ~0.2 GB activations per 4x8192-point batch under AMP.
model:
  NAME: BaseSeg
  encoder_args:
    NAME: PointNextEncoder
    blocks: [1, 1, 1, 1, 1]
    strides: [1, 4, 4, 4, 4]
    sa_layers: 2
    sa_use_res: True
    width: 32
    in_channels: 4          # = feature_dim(dataset.feature_keys); pos,heights -> 4
    expansion: 4
    radius: 0.1             # scaled units: 0.1 / 0.16 = 0.625 m on the ground, x2 per stage
    nsample: 32
    aggr_args:
      feature_type: dp_fj
      reduction: max
    group_args:
      NAME: ballquery
      normalize_dp: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: relu
    norm_args:
      norm: bn
  decoder_args:
    NAME: PointNextDecoder
  cls_args:
    NAME: SegHead
    num_classes: 5
    in_channels: null
    norm_args:
      norm: bn

pretrained_path: pretrained/openpoints/s3dis-pointnext-s/checkpoint/s3dis-train-pointnext-s-ngpus1-seed1742-20220525-162639-Gz4ViiL95b6KP9MMH2ytG3_ckpt_best.pth
